<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHALLENGE</title>

<style>
:root{
  --bg:#15171c;
  --panel:#20232a;
  --panel2:#272b33;
  --text:#f5f6f8;
  --muted:#a9adb7;
  --line:#343943;
  --accent:#d9b36c;
  --accent2:#8fb7a0;
  --danger:#d98282;
  --shadow:0 18px 50px rgba(0,0,0,.25);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#30343d 0,transparent 38%),
    var(--bg);
  color:var(--text);
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:min(1180px,94%);
  margin:auto;
}

.topbar{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:3px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn,
.account-btn{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  height:42px;
}

.icon-btn{
  width:42px;
  font-size:18px;
}

.account-btn{
  padding:0 15px;
}

.icon-btn:hover,
.account-btn:hover,
.card:hover{
  border-color:#5a606c;
  transform:translateY(-1px);
}

main{
  padding:30px 0 60px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.hero{
  padding:32px 0 25px;
}

.hero h1{
  margin:0 0 10px;
  font-size:clamp(30px,5vw,48px);
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:16px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:24px 0 14px;
}

.section-title h2{
  margin:0;
  font-size:19px;
}

.section-title span{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.card{
  min-height:105px;
  padding:18px;
  text-align:right;
  color:var(--text);
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:18px;
  transition:.18s;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.card .emoji{
  font-size:25px;
  display:block;
  margin-bottom:12px;
}

.card strong{
  display:block;
  font-size:15px;
}

.card small{
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-size:12px;
}

.language-row{
  display:flex;
  gap:8px;
  margin:15px 0 5px;
}

.lang{
  background:var(--panel);
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 13px;
}

.lang.active{
  color:var(--text);
  border-color:var(--accent);
  background:#2b2a27;
}

/* INTRO */

.intro{
  max-width:760px;
  margin:45px auto;
  text-align:center;
  padding:45px 25px;
  background:linear-gradient(145deg,#252932,#1d2026);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
}

.intro-icon{
  font-size:48px;
  margin-bottom:18px;
}

.intro h1{
  margin:0 0 12px;
  font-size:32px;
}

.intro p{
  color:var(--muted);
  line-height:1.9;
  max-width:600px;
  margin:0 auto 25px;
}

.start-btn{
  background:var(--accent);
  color:#171717;
  padding:13px 30px;
  border-radius:14px;
  font-weight:700;
}

.back-btn{
  background:transparent;
  color:var(--muted);
  padding:10px 15px;
  margin-top:10px;
}

/* GAME */

.game-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.game-meta{
  color:var(--muted);
  font-size:13px;
}

.timer{
  min-width:54px;
  text-align:center;
  padding:9px 12px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid var(--line);
}

.question-box{
  max-width:850px;
  margin:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:var(--shadow);
}

.question-icon{
  font-size:32px;
  margin-bottom:12px;
}

.question{
  font-size:21px;
  line-height:1.6;
  margin-bottom:22px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  padding:15px;
  text-align:right;
  color:var(--text);
  background:#292d35;
  border:1px solid #3a3f49;
  border-radius:14px;
}

.answer:hover{
  border-color:var(--accent);
}

.answer.correct{
  border-color:var(--accent2);
  background:#27342e;
}

.answer.wrong{
  border-color:var(--danger);
  background:#37292b;
}

/* VISUAL GAMES */

.visual-wrap{
  max-width:1050px;
  margin:auto;
}

.visual-title{
  text-align:center;
  margin-bottom:20px;
}

.visual-title h2{
  margin:0 0 8px;
}

.visual-title p{
  margin:0;
  color:var(--muted);
}

.images{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.scene{
  position:relative;
  min-height:330px;
  overflow:hidden;
  border-radius:22px;
  border:1px solid var(--line);
  background:#30353d;
}

.scene svg{
  width:100%;
  height:100%;
  min-height:330px;
  display:block;
}

.diff-point{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  background:transparent;
}

.visual-controls{
  text-align:center;
  margin-top:18px;
}

.progress{
  color:var(--muted);
  margin-bottom:10px;
}

/* CITY */

.city-image{
  max-width:900px;
  margin:auto;
  border-radius:24px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#2b3038;
}

.city-image svg{
  display:block;
  width:100%;
  height:auto;
}

.city-options{
  max-width:700px;
  margin:15px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* MEMORY */

.memory-card{
  max-width:700px;
  margin:25px auto;
  padding:40px;
  text-align:center;
  border-radius:24px;
  background:var(--panel);
  border:1px solid var(--line);
  font-size:55px;
}

.memory-question{
  text-align:center;
}

/* PROFILE */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal.open{
  display:flex;
}

.profile{
  width:min(500px,100%);
  background:#22252c;
  border:1px solid var(--line);
  border-radius:25px;
  padding:25px;
  box-shadow:var(--shadow);
}

.profile-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.profile-head h2{
  margin:0;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.stat{
  padding:15px;
  border-radius:15px;
  background:#2a2e36;
}

.stat small{
  color:var(--muted);
}

.stat strong{
  display:block;
  margin-top:5px;
  font-size:20px;
}

.pro{
  margin-top:15px;
  padding:17px;
  border-radius:16px;
  background:#2c2b27;
  border:1px solid #5b5140;
}

.close{
  background:transparent;
  color:var(--muted);
  font-size:22px;
}

.logout{
  width:100%;
  margin-top:18px;
  padding:12px;
  border-radius:13px;
  background:#302a2c;
  color:#e4b7b7;
}

/* AUTH */

.auth{
  max-width:430px;
  margin:70px auto;
  background:var(--panel);
  padding:28px;
  border-radius:25px;
  border:1px solid var(--line);
}

.auth h1{
  margin-top:0;
}

.input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid var(--line);
  background:#292d35;
  color:white;
  outline:none;
}

.primary{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:13px;
  background:var(--accent);
  color:#171717;
  font-weight:700;
}

.switch{
  margin-top:15px;
  color:var(--muted);
  text-align:center;
  cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .topbar{
    height:68px;
  }

  .logo{
    font-size:21px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .answers,
  .images,
  .city-options{
    grid-template-columns:1fr;
  }

  .question-box{
    padding:20px;
  }

  .question{
    font-size:18px;
  }

  .scene,
  .scene svg{
    min-height:250px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div class="logo">CHALLENGE</div>

  <div class="top-actions">
    <button class="icon-btn" onclick="toggleInterfaceLanguage()" title="لغة الواجهة">🌐</button>
    <button class="account-btn" onclick="openProfile()">مساحتي</button>
    <button class="icon-btn" onclick="goHome()" title="الرئيسية">⌂</button>
  </div>
</header>

<main>

<!-- HOME -->
<section id="home" class="screen active">

  <div class="hero">
    <h1 id="welcome">جاهز؟</h1>
    <p>اختر نوع التحدي الذي يناسبك وابدأ عندما تكون مستعدًا.</p>

    <div class="language-row">
      <button class="lang active" onclick="setQuestionLanguage('ar',this)">🇸🇦 عربي</button>
      <button class="lang" onclick="setQuestionLanguage('en',this)">🇬🇧 English</button>
      <button class="lang" onclick="setQuestionLanguage('mix',this)">🔀 Mix</button>
    </div>
  </div>

  <div class="section-title">
    <h2>التحديات</h2>
    <span>اختر أي تحدي</span>
  </div>

  <div class="grid">

    <button class="card" onclick="showIntro('history')">
      <span class="emoji">🏛️</span>
      <strong>التاريخ</strong>
      <small>أحداث وشخصيات وتفاصيل</small>
    </button>

    <button class="card" onclick="showIntro('sports')">
      <span class="emoji">⚽</span>
      <strong>الرياضة</strong>
      <small>معلومات وإحصائيات</small>
    </button>

    <button class="card" onclick="showIntro('science')">
      <span class="emoji">🔬</span>
      <strong>العلوم</strong>

    </button>

    <button class="card" onclick="showIntro('medicine')">
      <span class="emoji">⚕️</span>
      <strong>الطب والصحة</strong>
      <small>تفاصيل تحتاج تركيز</small>
    </button>

    <button class="card" onclick="showIntro('geography')">
      <span class="emoji">🌍</span>
      <strong>الجغرافيا</strong>
      <small>دول ومدن ومعالم</small>
    </button>

    <button class="card" onclick="showIntro('anime')">
      <span class="emoji">✦</span>
      <strong>الأنمي</strong>
      <small>One Piece و Conan و HxH</small>
    </button>

    <button class="card" onclick="showIntro('series')">
      <span class="emoji">🎬</span>
      <strong>المسلسلات</strong>
      <small>عربي وخليجي وتركي</small>
    </button>

    <button class="card" onclick="showIntro('movies')">
      <span class="emoji">🎞️</span>
      <strong>الأفلام</strong>
      <small>تفاصيل ومعلومات دقيقة</small>
    </button>

    <button class="card" onclick="showIntro('grammar')">
      <span class="emoji">✍️</span>
      <strong>اللغة</strong>
      <small>عربي وإنجليزي</small>
    </button>

    <button class="card" onclick="showIntro('puzzles')">
      <span class="emoji">🧩</span>
      <strong>الألغاز</strong>
      <small>منطق واستنتاج</small>
    </button>

    <button class="card" onclick="showIntro('focus')">
      <span class="emoji">🎯</span>
      <strong>التركيز</strong>
      <small>اختبر سرعة ملاحظتك</small>
    </button>

    <button class="card" onclick="showIntro('memory')">
      <span class="emoji">🧠</span>
      <strong>الذاكرة</strong>
      <small>تذكر قبل أن تختفي</small>
    </button>

    <button class="card" onclick="showIntro('math')">
      <span class="emoji">∑</span>
      <strong>الرياضيات</strong>
      <small>سرعة ودقة</small>
    </button>

    <button class="card" onclick="showIntro('visual')">
      <span class="emoji">👁️</span>
      <strong>ألعاب الصور</strong>
      <small>فروق ومدن وتركيز</small>
    </button>

  </div>
</section>


<!-- INTRO -->
<section id="intro" class="screen">
  <div class="intro">
    <div id="introIcon" class="intro-icon">🎯</div>
    <h1 id="introTitle">التحدي</h1>
    <p id="introText"></p>

    <button class="start-btn" onclick="startSelectedGame()">
      ابدأ التحدي
    </button>

    <br>

    <button class="back-btn" onclick="goHome()">
      العودة للتحديات
    </button>
  </div>
</section>


<!-- NORMAL GAME -->
<section id="game" class="screen">

  <div class="game-head">
    <div class="game-meta">
      <span id="gameCategory">التحدي</span>
      ·
      <span id="questionNumber">1 / 5</span>
    </div>

    <div class="timer" id="timer">15</div>
  </div>

  <div class="question-box">
    <div class="question-icon" id="questionIcon">🧠</div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
  </div>

</section>


<!-- VISUAL GAME -->
<section id="visual" class="screen">

  <div class="visual-wrap">

    <div class="visual-title">
      <h2 id="visualTitle">ألعاب الصور</h2>
      <p id="visualDescription">عينك أسرع من عقلك؟ أثبت ذلك.</p>
    </div>

    <div id="visualContent"></div>

    <div class="visual-controls">
      <button class="back-btn" onclick="goHome()">العودة</button>
    </div>

  </div>

</section>

</main>
</div>


<!-- PROFILE -->
<div class="modal" id="profileModal">

  <div class="profile">

    <div class="profile-head">
      <h2>مساحتي</h2>
      <button class="close" onclick="closeProfile()">×</button>
    </div>

    <div class="stats">

      <div class="stat">
        <small>النقاط</small>
        <strong id="profilePoints">0</strong>
      </div>

      <div class="stat">
        <small>XP</small>
        <strong id="profileXP">0</strong>
      </div>

      <div class="stat">
        <small>المستوى</small>
        <strong id="profileLevel">1</strong>
      </div>

      <div class="stat">
        <small>أفضل نتيجة</small>
        <strong id="profileBest">0</strong>
      </div>

      <div class="stat">
        <small>التحديات</small>
        <strong id="profileGames">0</strong>
      </div>

      <div class="stat">
        <small>المكافآت</small>
        <strong id="profileCoins">0</strong>
      </div>

    </div>

    <div class="pro">
      <strong>CHALLENGE PRO</strong>
      <div style="color:#b9bbc1;margin-top:6px">
        تحديات أصعب ومكافآت أكبر · 10 ريال شهريًا
      </div>
    </div>

    <button class="logout" onclick="logout()">↪</button>

  </div>

</div>

/* =========================
   NAVIGATION
========================= */

function showScreen(id){

  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function goHome(){
  clearInterval(timerInterval);
  showScreen("home");
}

function showIntro(category){

  selectedCategory=category;

  const data=intros[category];

  document.getElementById("introIcon").textContent=data.icon;
  document.getElementById("introTitle").textContent=data.title;
  document.getElementById("introText").textContent=data.text;

  showScreen("intro");
}

function startSelectedGame(){

  if(selectedCategory==="visual"){
    startVisualMenu();
    return;
  }

  if(selectedCategory==="memory"){
    startMemory();
    return;
  }

  startQuiz(selectedCategory);
}


/* =========================
   QUIZ
========================= */

function startQuiz(category){

  const list=questions[category] || questions.history;

  currentQuestion=0;
  score=0;

  document.getElementById("gameCategory").textContent=intros[category]?.title || "التحدي";

  showScreen("game");

  renderQuestion(list);
}

function renderQuestion(list){

  clearInterval(timerInterval);

  if(currentQuestion>=list.length){
    finishQuiz();
    return;
  }

  const q=list[currentQuestion];

  document.getElementById("questionNumber").textContent=
    `${currentQuestion+1} / ${list.length}`;

  document.getElementById("question").textContent=q[0];

  const icons={
    history:"🏛️",
    sports:"⚽",
    science:"🔬",
    medicine:"⚕️",
    geography:"🌍",
    anime:"✦",
    grammar:"✍️",
    puzzles:"🧩",
    math:"∑",
    focus:"🎯",
    series:"🎬",
    movies:"🎞️"
  };

  document.getElementById("questionIcon").textContent=
    icons[selectedCategory] || "🧠";

  const answers=document.getElementById("answers");
  answers.innerHTML="";

  q[1].forEach((answer,index)=>{

    const btn=document.createElement("button");

    btn.className="answer";
    btn.textContent=answer;

    btn.onclick=()=>answerQuestion(index,q[2],btn,list);

    answers.appendChild(btn);
  });

  timeLeft=15;
  document.getElementById("timer").textContent=timeLeft;

  timerInterval=setInterval(()=>{

    timeLeft--;

    document.getElementById("timer").textContent=timeLeft;

    if(timeLeft<=0){

      clearInterval(timerInterval);

      currentQuestion++;

      setTimeout(()=>{
        renderQuestion(list);
      },250);
    }

  },1000);
}

function answerQuestion(index,correct,button,list){

  clearInterval(timerInterval);

  const buttons=document.querySelectorAll(".answer");

  buttons.forEach(b=>b.disabled=true);

  if(index===correct){
    button.classList.add("correct");
    score += Math.max(10,timeLeft*5);
  }else{
    button.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }

  currentQuestion++;

  setTimeout(()=>{
    renderQuestion(list);
  },700);
}

function finishQuiz(){

  showScreen("intro");

  document.getElementById("introIcon").textContent="🏆";
  document.getElementById("introTitle").textContent="انتهى التحدي";
  document.getElementById("introText").textContent=
    `نتيجتك: ${score} نقطة. جرّب مرة ثانية وحاول تحطم نتيجتك.`;

  document.querySelector(".start-btn").textContent="إعادة التحدي";
}

          style="left:20%;top:50%"

        ${sceneSVG(true)}
      </div>

function foundDifference(button){

  if(button.dataset.found)return;

  button.dataset.found="1";
  window.diffCount++;

  document.getElementById("diffCount").textContent=window.diffCount;

  if(window.diffCount>=1){

    setTimeout(()=>{

      alert(
        "ممتاز 👁️\n\n"
        +"هذا النموذج التجريبي يعمل بنظام اكتشاف الاختلافات."
        +"\n\nسنضيف 5 نقاط حقيقية ومتغيرة لكل صورة في المرحلة التالية."
      );

    },200);
  }
}
