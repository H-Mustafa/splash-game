<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHALLENGE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
 --bg:#080a11;
 --panel:#10131d;
 --panel2:#151925;
 --line:#252b3a;
 --text:#f5f6fa;
 --muted:#858da1;
 --accent:#8b7cff;
}

body{
 margin:0;
 background:
 radial-gradient(circle at 50% -10%,#1a1d32 0,#0b0d15 42%,#07080d 100%);
 color:var(--text);
 font-family:Arial,Tahoma,sans-serif;
 min-height:100vh;
}

button,input{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

.app{
 width:min(980px,94%);
 margin:auto;
 padding:18px 0 45px;
}

/* TOP */

.topbar{
 height:58px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:18px;
}

.brand{
 font-size:20px;
 font-weight:900;
 letter-spacing:.8px;
}

.actions{
 display:flex;
 gap:7px;
 align-items:center;
}

.icon{
 width:38px;
 height:38px;
 border-radius:12px;
 border:1px solid var(--line);
 background:#111520;
 color:#dfe3ed;
 display:grid;
 place-items:center;
 font-size:16px;
}

.profileBtn{
 border:1px solid var(--line);
 background:#111520;
 color:#e9ebf2;
 padding:9px 12px;
 border-radius:12px;
 font-size:13px;
 font-weight:bold;
}

/* AUTH */

.auth{
 max-width:410px;
 margin:9vh auto;
 background:rgba(16,19,29,.96);
 border:1px solid var(--line);
 border-radius:22px;
 padding:28px;
}

.authLogo{
 text-align:center;
 font-size:34px;
 font-weight:900;
 margin-bottom:7px;
}

.auth h1{
 text-align:center;
 font-size:27px;
 margin:0 0 22px;
}

input{
 width:100%;
 background:#0b0e16;
 color:white;
 border:1px solid var(--line);
 border-radius:12px;
 padding:13px;
 margin:5px 0;
 outline:none;
}

input:focus{
 border-color:#5e56a9;
}

.mainBtn{
 width:100%;
 border:0;
 background:#7668e8;
 color:white;
 padding:13px;
 border-radius:12px;
 font-weight:bold;
 margin-top:9px;
}

.switch{
 text-align:center;
 color:var(--muted);
 margin-top:14px;
 font-size:13px;
}

.link{
 color:#a69dff;
 cursor:pointer;
 font-weight:bold;
}

.notice{
 margin-top:10px;
 padding:10px;
 border-radius:10px;
 background:#171c29;
 color:#b9c0d0;
 font-size:13px;
}

/* HOME */

.welcome{
 padding:10px 2px 17px;
}

.welcome h2{
 margin:0;
 font-size:25px;
 letter-spacing:-.3px;
}

.welcome p{
 display:none;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin-bottom:20px;
}

.stat{
 background:#10131d;
 border:1px solid var(--line);
 border-radius:14px;
 padding:12px 8px;
 text-align:center;
}

.stat b{
 display:block;
 font-size:18px;
 margin-bottom:4px;
}

.stat span{
 color:var(--muted);
 font-size:11px;
}

.title{
 font-size:15px;
 font-weight:bold;
 margin:19px 2px 9px;
}

/* CATEGORIES */

.categories{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:8px;
}

.category{
 min-height:75px;
 background:#10131d;
 border:1px solid var(--line);
 color:#e9ebf2;
 border-radius:15px;
 padding:11px 7px;
 transition:.15s;
}

.category:hover{
 background:#161a27;
 border-color:#3a4051;
 transform:translateY(-1px);
}

.category .ico{
 display:block;
 font-size:22px;
 margin-bottom:7px;
 line-height:1;
}

.category .name{
 font-size:11px;
 font-weight:bold;
}

.category.anime{
 border-color:#303448;
}

/* QUESTION LANGUAGE */

.langRow{
 display:flex;
 gap:7px;
}

.lang{
 flex:1;
 padding:10px;
 border-radius:11px;
 border:1px solid var(--line);
 background:#10131d;
 color:#cbd0db;
 font-size:12px;
}

.lang.active{
 border-color:#655bb6;
 color:white;
 background:#17172a;
}

/* GAME */

.game{
 max-width:700px;
 margin:15px auto 0;
}

.gameHeader{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:12px;
}

.small{
 color:var(--muted);
 font-size:11px;
}

.timer{
 color:#dfe2ea;
 font-size:15px;
 font-weight:bold;
}

.timer.low{
 color:#ffb0b0;
}

.progress{
 height:4px;
 background:#191e2b;
 border-radius:20px;
 overflow:hidden;
 margin-bottom:25px;
}

.progressBar{
 height:100%;
 width:0;
 background:#7165d5;
 transition:.2s;
}

.questionBox{
 background:#10131d;
 border:1px solid var(--line);
 border-radius:20px;
 padding:22px;
}

.questionIcon{
 width:42px;
 height:42px;
 border-radius:12px;
 background:#171b27;
 display:grid;
 place-items:center;
 font-size:20px;
 margin:0 auto 18px;
}

.question{
 font-size:21px;
 font-weight:bold;
 line-height:1.55;
 text-align:center;
 margin-bottom:20px;
}

.answers{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.answer{
 border:1px solid var(--line);
 background:#141823;
 color:#e8eaf0;
 padding:13px 12px;
 border-radius:12px;
 text-align:right;
 font-size:13px;
 min-height:48px;
}

.answer:hover{
 background:#191e2c;
}

.answer.correct{
 background:#142a22;
 border-color:#376a56;
}

.answer.wrong{
 background:#2a171b;
 border-color:#694047;
}

/* RESULT */

.result{
 max-width:500px;
 margin:50px auto;
 text-align:center;
 background:#10131d;
 border:1px solid var(--line);
 border-radius:22px;
 padding:28px;
}

.result h2{
 margin:0 0 15px;
}

.finalScore{
 font-size:48px;
 font-weight:900;
 margin:8px;
}

.resultStats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin:20px 0;
}

.resultStats div{
 background:#151925;
 border-radius:12px;
 padding:11px;
}

.resultStats b{
 display:block;
 font-size:18px;
}

.resultStats span{
 color:var(--muted);
 font-size:10px;
}

/* PROFILE */

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:20;
}

.modalBox{
 width:min(500px,100%);
 background:#10131d;
 border:1px solid var(--line);
 border-radius:20px;
 padding:20px;
}

.modalHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:18px;
}

.modalHead h2{
 margin:0;
 font-size:19px;
}

.close{
 width:34px;
 height:34px;
 border-radius:10px;
 border:1px solid var(--line);
 background:#151925;
 color:white;
}

.profileName{
 font-size:23px;
 font-weight:bold;
 margin-bottom:15px;
}

.profileGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
}

.profileItem{
 background:#151925;
 border-radius:12px;
 padding:12px;
}

.profileItem b{
 display:block;
 font-size:15px;
 margin-top:3px;
}

.profileItem span{
 color:var(--muted);
 font-size:10px;
}

.subscription{
 margin-top:15px;
 padding:14px;
 border:1px solid var(--line);
 border-radius:13px;
}

.proBtn{
 width:100%;
 margin-top:9px;
 border:1px solid #48406f;
 background:#1b1830;
 color:#d8d2ff;
 border-radius:12px;
 padding:12px;
}

/* FRIEND */

.friendCode{
 font-size:27px;
 letter-spacing:5px;
 text-align:center;
 background:#0a0d14;
 border:1px solid var(--line);
 border-radius:13px;
 padding:17px;
 margin:15px 0;
}

/* MOBILE */

@media(max-width:760px){
 .categories{
  grid-template-columns:repeat(4,1fr);
 }
}

@media(max-width:540px){
 .app{
  width:92%;
 }
 .brand{
  font-size:18px;
 }
 .profileBtn{
  max-width:100px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
 }
 .stats{
  grid-template-columns:repeat(2,1fr);
 }
 .categories{
  grid-template-columns:repeat(3,1fr);
 }
 .category{
  min-height:72px;
 }
 .question{
  font-size:19px;
 }
 .answers{
  grid-template-columns:1fr;
 }
 .questionBox{
  padding:17px;
 }
}

/* ENGLISH */

html.en .arabicOnly{
 display:none;
}
</style>
</head>

/* AUTH */

async function init(){

 const {data}=await db.auth.getSession();

 if(data.session){

  user=data.session.user;

  await loadProfile();

  showHome();

 }else{

  showAuth();

 }

}


async function register(){

 const username=
 document.getElementById("registerUsername").value.trim();

 const email=
 document.getElementById("registerEmail").value.trim();

 const password=
 document.getElementById("registerPassword").value;

 if(!username||!email||!password){

  message("أكمل البيانات");

  return;

 }

 const {data,error}=
 await db.auth.signUp({
  email,
  password
 });

 if(error){

  message(error.message);

  return;

 }

 user=data.user;

 if(user){

  await db.from("profiles").upsert({
   id:user.id,
   username:username,
   level:1,
   xp:0,
   coins:0,
   total_score:0,
   best_score:0,
   games_played:0,
   login_days:0,
   is_pro:false
  });

 }

 message("تم إنشاء الحساب");

 setTimeout(async()=>{
  await loadProfile();
  showHome();
 },500);

}


async function login(){

 const email=
 document.getElementById("loginEmail").value.trim();

 const password=
 document.getElementById("loginPassword").value;

 if(!email||!password){

  message("أدخل البريد وكلمة المرور");

  return;

 }

 const {data,error}=
 await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){

  message("البريد أو كلمة المرور غير صحيحة");

  return;

 }

 user=data.user;

 await loadProfile();

 showHome();

}


async function loadProfile(){

 if(!user)return;

 let {data}=await db
 .from("profiles")
 .select("*")
 .eq("id",user.id)
 .single();

 if(!data){

  const username=
   user.email
   ?user.email.split("@")[0]
   :"User";

  const result=
   await db.from("profiles")
   .upsert({
    id:user.id,
    username:username
   })
   .select()
   .single();

  data=result.data;

 }

 profile=data;

}

/* GAME */

function startGame(){

 clearInterval(timer);

 questions=
 [...(bank[category]||bank.general)]
 .sort(()=>Math.random()-.5)
 .slice(0,10);

 index=0;
 score=0;
 correctCount=0;
 wrongCount=0;

 document.getElementById("home")
 .classList.add("hidden");

 document.getElementById("result")
 .classList.add("hidden");

 document.getElementById("game")
 .classList.remove("hidden");

 loadQuestion();

}


function getLimit(){

 if(mode==="easy")return 20;

 if(mode==="hard")return 12;

 return 8;

}


function loadQuestion(){

 clearInterval(timer);

 if(index>=questions.length){

  finish();

  return;

 }

 const q=questions[index];

 document.getElementById("gameCategory")
 .textContent=
 categoryName(category);

 document.getElementById("gameNumber")
 .textContent=
 `${index+1} / ${questions.length}`;

 document.getElementById("questionIcon")
 .textContent=q[0];

 document.getElementById("question")
 .textContent=q[1];

 const answers=
 document.getElementById("answers");

 answers.innerHTML="";

 q[2].forEach((answer,i)=>{

  const btn=
  document.createElement("button");

  btn.className="answer";

  btn.textContent=answer;

  btn.onclick=()=>{
   answerQuestion(i,btn);
  };

  answers.appendChild(btn);

 });

 document.getElementById("progressBar")
 .style.width=
 ((index/questions.length)*100)+"%";

 timeLeft=getLimit();

 updateTimer();

 timer=setInterval(()=>{

  timeLeft--;

  updateTimer();

  if(timeLeft<=0){

   clearInterval(timer);

   wrongCount++;

   index++;

   loadQuestion();

  }

 },1000);

}


function updateTimer(){

 const el=
 document.getElementById("timer");

 el.textContent=
 "00:"+String(timeLeft).padStart(2,"0");

 el.classList.toggle(
  "low",
  timeLeft<=5
 );

}


function answerQuestion(choice,button){

 clearInterval(timer);

 const q=questions[index];

 const buttons=
 document.querySelectorAll(".answer");

 buttons.forEach(x=>x.disabled=true);

 if(choice===q[3]){

  button.classList.add("correct");

  correctCount++;

  score+=
   100+
   Math.max(0,timeLeft*5);

 }else{

  button.classList.add("wrong");

  if(buttons[q[3]])
   buttons[q[3]].classList.add("correct");

  wrongCount++;

 }

 setTimeout(()=>{

  index++;

  loadQuestion();

 },500);

}


/* RESULT */

async function finish(){

 clearInterval(timer);

 const earnedXP=
 Math.floor(score/10);

 const coins=
 Math.floor(score/100);

 document.getElementById("game")
 .classList.add("hidden");

 document.getElementById("result")
 .classList.remove("hidden");

 document.getElementById("finalScore")
 .textContent=score;

 document.getElementById("correct")
 .textContent=correctCount;

 document.getElementById("wrong")
 .textContent=wrongCount;

 document.getElementById("earnedXP")
 .textContent=earnedXP;

 if(!user||!profile)return;

 const total=
 (profile.total_score||0)+score;

 const xp=
 (profile.xp||0)+earnedXP;

 const coin=
 (profile.coins||0)+coins;

 const games=
 (profile.games_played||0)+1;

 const best=
 Math.max(profile.best_score||0,score);

 const level=
 Math.floor(xp/1000)+1;

 const {error}=
 await db.from("profiles")
 .update({
  total_score:total,
  xp:xp,
  coins:coin,
  games_played:games,
  best_score:best,
  level:level
 })
 .eq("id",user.id);

 if(!error){

  profile.total_score=total;
  profile.xp=xp;
  profile.coins=coin;
  profile.games_played=games;
  profile.best_score=best;
  profile.level=level;

 }

 await db.from("game_results").insert({

  player_id:user.id,
  score:score,
  xp_earned:earnedXP,
  coins_earned:coins,
  correct_answers:correctCount,
  wrong_answers:wrongCount

 });

}
